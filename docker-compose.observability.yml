# Optional local-only extension. Never use this override for Render production.
# Requires Docker Compose 2.24.4 or later for the '!override' attribute replacement feature.
name: tasklane-observability

services:
  postgres:
    container_name: tasklane-obs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasklane
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "tasklane"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    container_name: tasklane-obs-app
    build:
      context: .
      dockerfile: Dockerfile.observability
    image: tasklane:otel
    mem_limit: 384m
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tasklane
      TASKLANE_OTEL_ENABLED: "true"
      TASKLANE_INCIDENT_DRILL_ENABLED: local-only
      TASKLANE_OTEL_ENDPOINT: http://otel-collector:4318
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    mem_limit: 320m
    volumes:
      - ./observability/collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 384m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 512m
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    ports: ["127.0.0.1:3200:3200"]
    mem_limit: 384m
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yaml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    mem_limit: 512m
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/alerting/tasklane.yml:/etc/grafana/provisioning/alerting/tasklane.yml:ro
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  # Disposable local contact point receiver; never expose on a public interface.
  alert-sink:
    image: python:3.11.14-alpine3.22
    command: ["python", "-u", "/opt/tasklane/alert_sink.py"]
    volumes:
      - ./observability/alert_sink.py:/opt/tasklane/alert_sink.py:ro
    ports:
      - "127.0.0.1:8088:8080"
    mem_limit: 64m
    restart: unless-stopped
