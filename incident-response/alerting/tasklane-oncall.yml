# Versioned, local-only Grafana managed alert, contact point, and routing for Issue #4 On-Call Responder.
apiVersion: 1

groups:
  - orgId: 1
    name: TaskLane user-impact alerts
    folder: TaskLane
    interval: 10s
    rules:
      - uid: tasklane_5xx_rate
        title: TaskLane5xxRate
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'sum(increase(tasklane_task_5xx_errors_total[2m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - type: query
                  query:
                    params: [B]
                  reducer:
                    type: last
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: "TaskLane local API task operation returned HTTP 5xx"
          description: "Investigate correlated task-operation metrics, Loki logs and Tempo traces. Local drill only."
        labels:
          service: tasklane-api
          severity: critical
          project: tasklane

contactPoints:
  - orgId: 1
    name: tasklane-local-drill
    receivers:
      - uid: tasklane_local_sink
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://alert-sink:8080/alerts
          httpMethod: POST
          maxAlerts: '5'
      - uid: tasklane_oncall_responder
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://oncall-responder:8001/alerts
          httpMethod: POST
          maxAlerts: '5'

policies:
  - orgId: 1
    receiver: tasklane-local-drill
    group_by: [alertname, grafana_folder]
    group_wait: 0s
    group_interval: 10s
    repeat_interval: 1h
